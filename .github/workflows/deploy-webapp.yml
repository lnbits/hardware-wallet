name: Deploy installer and Bowser Wallet webapp

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install verified Arduino CLI
        shell: bash
        run: |
          cli_archive="${RUNNER_TEMP}/arduino-cli.tar.gz"
          cli_directory="${RUNNER_TEMP}/arduino-cli"
          curl --fail --location --silent --show-error \
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz \
            --output "${cli_archive}"
          echo "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  ${cli_archive}" | sha256sum --check --strict
          mkdir -p "${cli_directory}"
          tar -xzf "${cli_archive}" -C "${cli_directory}"
          echo "${cli_directory}" >> "${GITHUB_PATH}"

      - name: Configure ESP32 platform index
        shell: bash
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Validate firmware version
        id: firmware
        shell: bash
        run: |
          firmware_version="$(sed -n 's/^#define BOWSER_FIRMWARE_VERSION "\([^"]*\)"$/\1/p' wallet/wallet.ino)"
          test -n "${firmware_version}"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v${firmware_version}"
          echo "version=${firmware_version}" >> "${GITHUB_OUTPUT}"

      - name: Test firmware safety helpers
        shell: bash
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/input_debounce_test.cpp \
            -o "${RUNNER_TEMP}/input_debounce_test"
          "${RUNNER_TEMP}/input_debounce_test"
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/rng_health_test.cpp \
            -o "${RUNNER_TEMP}/rng_health_test"
          "${RUNNER_TEMP}/rng_health_test"
          tools/test_libwally.sh

      - name: Compile and package every supported board
        shell: bash
        run: |
          firmware_version="${{ steps.firmware.outputs.version }}"
          # Coming soon:
          # esp32_2432s028r esp32_3248s035r
          for target in lilygo_tdisplay esp32_3248s035c; do
            tools/build_firmware.sh "${target}" "firmware-build/${target}"
            python3 tools/package_firmware.py \
              "${target}" "${firmware_version}" "firmware-build/${target}" \
              "built-firmware/v${firmware_version}/${target}" \
              --boot-app0 "${HOME}/.arduino15/packages/esp32/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin"
          done

          target="waveshare_esp32_c6_lcd_1_3"
          tools/build_firmware.sh "${target}" "firmware-build/${target}"
          python3 tools/package_firmware.py \
            "${target}" "${firmware_version}" "firmware-build/${target}" \
            "built-firmware/v${firmware_version}/${target}" \
            --boot-app0 "${HOME}/.arduino15/packages/esp32/hardware/esp32/3.3.11/tools/partitions/boot_app0.bin"

          for manifest in built-firmware/v${firmware_version}/*/manifest.json; do
            python3 -m json.tool "${manifest}" > /dev/null
          done

      - name: Upload source-built firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-built-firmware
          path: built-firmware
          if-no-files-found: error
          retention-days: 7

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Configure base path
        shell: bash
        run: echo "BASE_PATH=${{ steps.pages.outputs.base_path }}/webapp" >> "${GITHUB_ENV}"

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Check webapp
        working-directory: webapp
        run: npm run lint

      - name: Test webapp
        working-directory: webapp
        run: npm test

      - name: Build static site
        working-directory: webapp
        run: npm run build

      - name: Assemble Pages site
        shell: bash
        run: |
          firmware_version="${{ steps.firmware.outputs.version }}"
          mkdir -p pages/webapp pages/installer/firmware/esp32/current
          cp index.html pages/index.html
          cp -R assets pages/assets
          cp -R installer/. pages/installer/
          rm -rf pages/installer/firmware/esp32
          mkdir -p pages/installer/firmware/esp32/current
          cp -R "built-firmware/v${firmware_version}/." pages/installer/firmware/esp32/current/
          cp -R webapp/build/. pages/webapp/
          touch pages/.nojekyll

      - name: Validate Pages site
        shell: bash
        run: |
          test -f pages/index.html
          test -f pages/installer/index.html
          # Coming soon: esp32_2432s028r esp32_3248s035r
          for target in lilygo_tdisplay esp32_3248s035c waveshare_esp32_c6_lcd_1_3; do
            test -f "pages/installer/firmware/esp32/current/${target}/manifest.json"
            test -f "pages/installer/firmware/esp32/current/${target}/ESP_IMAGE_SHA256.txt"
          done
          test -f pages/webapp/index.html
          test -f pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download source-built firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-built-firmware
          path: built-firmware

      - name: Prepare firmware release assets
        id: firmware
        shell: bash
        run: |
          firmware_version="${GITHUB_REF_NAME}"
          firmware_dir="built-firmware/${firmware_version}"
          mkdir -p release-assets
          : > release-hashes.txt
          # Coming soon: esp32_2432s028r esp32_3248s035r
          for target in lilygo_tdisplay esp32_3248s035c waveshare_esp32_c6_lcd_1_3; do
            target_dir="${firmware_dir}/${target}"
            firmware_bin="${target_dir}/wallet.ino.bin"
            test -f "${firmware_bin}"
            firmware_hash="$(python3 tools/esp_image_hash.py "${firmware_bin}")"
            published_hash="$(tr -d '[:space:]' < "${target_dir}/ESP_IMAGE_SHA256.txt")"
            test "${firmware_hash}" = "${published_hash}"

            cp "${firmware_bin}" "release-assets/Bowser-Wallet-${firmware_version}-${target}.bin"
            cp "${target_dir}/ESP_IMAGE_SHA256.txt" \
              "release-assets/Bowser-Wallet-${firmware_version}-${target}-ESP_IMAGE_SHA256.txt"
            zip -j "release-assets/Bowser-Wallet-${firmware_version}-${target}.zip" "${target_dir}"/*
            printf '%s %s\n' "${target}" "${firmware_hash}" >> release-hashes.txt
          done

          echo "version=${firmware_version}" >> "${GITHUB_OUTPUT}"

      - name: Write firmware verification notes
        env:
          FIRMWARE_VERSION: ${{ steps.firmware.outputs.version }}
        shell: bash
        run: |
          {
            printf '%s\n' \
            '<!-- bowser-firmware:start -->' \
            "## Bowser Wallet firmware ${FIRMWARE_VERSION}" \
            '' \
            'This firmware was compiled from the tagged source by the release workflow.' \
            '' \
            'ESP application image SHA-256 by board:' \
            ''
            while read -r target firmware_hash; do
              printf -- '- `%s`: `%s`\n' "${target}" "${firmware_hash}"
            done < release-hashes.txt
            printf '%s\n' '' \
            'Compare this value with the SHA-256 shown on the device and by the web installer.' \
            '<!-- bowser-firmware:end -->'
          } > release-firmware.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release view "${GITHUB_REF_NAME}" --json body --jq .body > release-body.md
            # shellcheck disable=SC2016
            awk '
              /<!-- bowser-firmware:start -->/ { skip = 1 }
              /<!-- bowser-firmware:end -->/ { skip = 0; next }
              !skip { print }
            ' release-body.md > release-body-without-firmware.md
            printf '\n' >> release-body-without-firmware.md
            cat release-firmware.md >> release-body-without-firmware.md
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-body-without-firmware.md
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --verify-tag \
              --generate-notes \
              --notes "$(cat release-firmware.md)"
          fi
