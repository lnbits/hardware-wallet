name: Deploy installer and Bowser Wallet webapp

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Configure base path
        shell: bash
        run: echo "BASE_PATH=${{ steps.pages.outputs.base_path }}/webapp" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Check webapp
        working-directory: webapp
        run: npm run lint

      - name: Test webapp
        working-directory: webapp
        run: npm test

      - name: Build static site
        working-directory: webapp
        run: npm run build

      - name: Assemble Pages site
        shell: bash
        run: |
          mkdir -p pages/webapp
          cp index.html pages/index.html
          cp -R assets pages/assets
          cp -R installer pages/installer
          cp -R webapp/build/. pages/webapp/
          touch pages/.nojekyll

      - name: Validate Pages site
        shell: bash
        run: |
          test -f pages/index.html
          test -f pages/installer/index.html
          test -f pages/webapp/index.html
          test -f pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare latest firmware release assets
        id: firmware
        shell: bash
        run: |
          firmware_version="$(find installer/firmware/esp32 -mindepth 1 -maxdepth 1 -type d -name 'v*' -printf '%f\n' | sort -V | tail -n 1)"
          firmware_dir="installer/firmware/esp32/${firmware_version}"
          firmware_bin="${firmware_dir}/wallet.ino.bin"
          firmware_hash="$(python3 tools/esp_image_hash.py "${firmware_bin}")"
          published_hash="$(tr -d '[:space:]' < "${firmware_dir}/ESP_IMAGE_SHA256.txt")"
          test "${firmware_hash}" = "${published_hash}"

          mkdir -p release-assets
          cp "${firmware_bin}" "release-assets/Bowser-HWW-firmware-${firmware_version}.bin"
          cp "${firmware_dir}/ESP_IMAGE_SHA256.txt" "release-assets/Bowser-HWW-firmware-${firmware_version}-ESP_IMAGE_SHA256.txt"
          zip -j "release-assets/Bowser-HWW-firmware-${firmware_version}.zip" "${firmware_dir}"/*

          echo "version=${firmware_version}" >> "${GITHUB_OUTPUT}"
          echo "hash=${firmware_hash}" >> "${GITHUB_OUTPUT}"

      - name: Write firmware verification notes
        shell: bash
        run: |
          printf '%s\n' \
            '<!-- bowser-firmware:start -->' \
            "## Bowser HWW firmware ${{ steps.firmware.outputs.version }}" \
            '' \
            'ESP application image SHA-256:' \
            '' \
            '`${{ steps.firmware.outputs.hash }}`' \
            '' \
            'Compare this value with the SHA-256 shown on the device after installation.' \
            '<!-- bowser-firmware:end -->' > release-firmware.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release view "${GITHUB_REF_NAME}" --json body --jq .body > release-body.md
            awk '
              /<!-- bowser-firmware:start -->/ { skip = 1 }
              /<!-- bowser-firmware:end -->/ { skip = 0; next }
              !skip { print }
            ' release-body.md > release-body-without-firmware.md
            printf '\n' >> release-body-without-firmware.md
            cat release-firmware.md >> release-body-without-firmware.md
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-body-without-firmware.md
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --verify-tag \
              --generate-notes \
              --notes "$(cat release-firmware.md)"
          fi
