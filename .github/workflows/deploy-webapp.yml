name: Deploy installer and Bowser Wallet webapp

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Configure base path
        shell: bash
        run: echo "BASE_PATH=${{ steps.pages.outputs.base_path }}/webapp" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Check webapp
        working-directory: webapp
        run: npm run lint

      - name: Test webapp
        working-directory: webapp
        run: npm test

      - name: Build static site
        working-directory: webapp
        run: npm run build

      - name: Assemble Pages site
        shell: bash
        run: |
          mkdir -p pages/webapp
          cp index.html pages/index.html
          cp -R assets pages/assets
          cp -R installer pages/installer
          cp -R webapp/build/. pages/webapp/
          touch pages/.nojekyll

      - name: Validate Pages site
        shell: bash
        run: |
          test -f pages/index.html
          test -f pages/installer/index.html
          test -f pages/webapp/index.html
          test -f pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
